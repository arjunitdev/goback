<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic results - YouTube (fixture)</title>
  </head>
  <body>
    <ytd-app>
      <ytd-masthead>
        <div id="background"></div>
        <yt-searchbox><input name="search_query" aria-label="Search" /></yt-searchbox>
      </ytd-masthead>
      <ytd-guide-renderer>guide</ytd-guide-renderer>
      <ytd-page-manager>
        <ytd-search><ytd-video-renderer>result</ytd-video-renderer></ytd-search>
      </ytd-page-manager>
    </ytd-app>
  </body>
</html>
