<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic home - YouTube (fixture)</title>
  </head>
  <body>
    <ytd-app>
      <ytd-masthead>
        <div id="background"></div>
        <yt-searchbox><input name="search_query" aria-label="Search" /></yt-searchbox>
      </ytd-masthead>
      <ytd-mini-guide-renderer>guide</ytd-mini-guide-renderer>
      <ytd-page-manager>
        <ytd-browse><ytd-rich-grid-renderer>grid</ytd-rich-grid-renderer></ytd-browse>
      </ytd-page-manager>
    </ytd-app>
  </body>
</html>
