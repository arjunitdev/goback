<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic dark feed - Facebook (fixture, no real content)</title>
  </head>
  <body style="background: #18191a; color: #e4e6eb">
    <!-- The dark colour sits on an inner row, not on the banner itself, as on the real site. -->
    <div role="banner">
      <div id="hdr-row" style="background: #242526; display: flex; align-items: center; height: 56px">
        <a href="/" aria-label="Facebook"><svg width="40" height="40"></svg></a>
        <label id="hdr-pill" style="background: #3a3b3c; border-radius: 20px; padding: 6px 12px; width: 240px; display: block">
          <input type="search" aria-label="Search" />
        </label>
      </div>
    </div>
    <div role="navigation">nav</div>
    <div role="main">
      <div role="feed">
        <div role="article" data-keep="1"><a href="/posts/1">synthetic post</a></div>
      </div>
    </div>
    <div role="dialog" aria-modal="true" data-keep="1"><button>Privacy audience</button></div>
    <!-- Facebook's "Remember password" prompt: posts to /login/..., but has no typed field. -->
    <div data-keep="1">
      <form action="/login/save-device/?login_source=login" method="post">
        <input type="hidden" name="jazoest" value="1" />
        <button type="submit">OK</button>
      </form>
    </div>
  </body>
</html>
